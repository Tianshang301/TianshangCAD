name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "readme/**"
      - "README.md"
      - "THIRD_PARTY_LICENSES.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "readme/**"
      - "README.md"
      - "THIRD_PARTY_LICENSES.md"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,boolean,solver,occ]" types-PyYAML
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,boolean]"
          if [ "${{ matrix.python }}" = "3.12" ]; then pip install ".[solver]"; fi
      - name: Run pytest with coverage gate
        run: |
          pytest -m "not stress" --cov=tianshangcad --cov-report=term-missing --cov-fail-under=80 -q
      - name: Upload coverage report
        if: ${{ matrix.python == '3.12' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore

  stress:
    name: Stress (concurrency + soak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,boolean]"
      - name: Run stress tests
        run: pytest -m stress -q
