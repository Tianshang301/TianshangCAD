version: "3.8"

services:
  tianshangcad-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tianshangcad-server:0.5.0
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - TIANSHANGCAD_RUNTIME=analytic
      - TIANSHANGCAD_HEADLESS=true
      - TIANSHANGCAD_TEMP_DIR=/tmp/tianshangcad
      - TIANSHANGCAD_LOG_LEVEL=INFO
      - TIANSHANGCAD_API_KEY=${TIANSHANGCAD_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
