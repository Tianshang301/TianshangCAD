[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-mcp-server"
version = "0.6.0"
description = "Modern CAD CLI + MCP Server system (2D/3D drawing, editing, measurement, rendering, JSON-driven)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tianshang301", email = "Tianshang301@outlook.com" }]
keywords = ["cad", "mcp", "cli", "drawing", "geometry", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "ezdxf>=1.3",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "mcp>=2.0",
    "apscheduler[sqlalchemy]>=3.10",
    "matplotlib>=3.8",
    "deepdiff>=7.0",
    "prometheus-client>=0.20",
    "imageio>=2.34",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
occ = ["cadquery>=2.4"]
freecad = []
boolean = ["trimesh>=4.0", "manifold3d>=2.0"]
solver = ["planegcs>=0.8.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
cad-cli = "cad_mcp_server.cli.main:main"

[project.urls]
Homepage = "https://github.com/Tianshang301/TianshangCAD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cad_mcp_server" = ["config/*.yaml", "config/*.json", "py.typed", "templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "S", "A", "D", "N", "RUF"]
ignore = ["D203", "D213", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"src/cad_mcp_server/mcp/tools/**" = ["A002", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
exclude = ["tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["cad_mcp_server"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "pragma: no cover",
]
