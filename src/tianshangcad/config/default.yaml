# Default configuration for tianshangcad / tianshangcad-server.
# Every key may be overridden by a TIANSHANGCAD_* environment variable.
settings:
  runtime: analytic
  headless: true
  temp_dir: /tmp/tianshangcad
  max_memory: 4096
  log_level: INFO
  log_json: true
  config_path: ~/.tianshangcad/config.yaml
  mcp_transport: stdio
  mcp_port: 8081
  mcp_host: 0.0.0.0
  auto_approve: ""
  safe_mode: false
  api_key: ""
  debug: false
